<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listening Room</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ LANDING SCREEN ============ -->
<section id="screen-landing" class="screen">
  <div class="landing-card">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Listening&nbsp;Room</h1>
    </div>
    <p class="tagline">One player. Everyone's screen. Press play and the whole room hears it.</p>

    <div class="landing-tabs">
      <button class="tab-btn active" data-tab="create">Create a room</button>
      <button class="tab-btn" data-tab="join">Join a room</button>
    </div>

    <form id="form-create" class="landing-form active">
      <label for="create-username">Your name</label>
      <input id="create-username" type="text" maxlength="20" placeholder="e.g. Cade" required />
      <button type="submit" class="btn-primary">Create room</button>
    </form>

    <form id="form-join" class="landing-form">
      <label for="join-code">Room code</label>
      <input id="join-code" type="text" maxlength="5" placeholder="A7K92" autocapitalize="characters" required />
      <label for="join-username">Your name</label>
      <input id="join-username" type="text" maxlength="20" placeholder="e.g. Brantley" required />
      <button type="submit" class="btn-primary">Join room</button>
    </form>

    <p id="landing-error" class="error-text"></p>
    <p id="landing-status" class="status-text">Connecting…</p>
  </div>
</section>

<!-- ============ ROOM SCREEN ============ -->
<section id="screen-room" class="screen">

  <header class="topbar">
    <div class="room-code-block">
      <span class="room-code-label">Room</span>
      <span id="room-code-display" class="room-code-display">-----</span>
      <button id="btn-copy-code" class="icon-btn" title="Copy room code">
        <svg viewBox="0 0 24 24"><path d="M8 8V4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-4"/><rect x="4" y="8" width="12" height="13" rx="1"/></svg>
      </button>
    </div>
    <div class="connection-block">
      <span id="connection-dot" class="dot"></span>
      <span id="connection-text">Connecting…</span>
    </div>
    <button id="btn-leave" class="btn-ghost">Leave room</button>
  </header>

  <div class="layout">

    <!-- LEFT: Users -->
    <aside class="panel panel-users">
      <h2>People <span id="users-count" class="count-pill">0</span></h2>
      <ul id="users-list" class="users-list"></ul>
    </aside>

    <!-- CENTER: Player -->
    <main class="panel panel-player">
      <div class="media-stage">
        <div id="youtube-player-wrap" class="media-embed hidden">
          <div id="youtube-player"></div>
        </div>
        <div id="spotify-player-wrap" class="media-embed hidden">
          <div id="spotify-embed"></div>
        </div>
        <div id="empty-stage" class="empty-stage">
          <svg viewBox="0 0 24 24" class="empty-icon"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <p>Nothing queued yet</p>
          <span>Paste a YouTube or Spotify link below to start the room</span>
        </div>
      </div>

      <div class="now-playing">
        <img id="now-thumb" class="now-thumb" alt="" />
        <div class="now-meta">
          <div id="now-title" class="now-title">Nothing playing</div>
          <div id="now-added-by" class="now-added-by"></div>
        </div>
      </div>

      <div class="seek-row">
        <span id="cur-time" class="time-label">0:00</span>
        <input id="seek-bar" type="range" min="0" max="100" value="0" step="1" />
        <span id="dur-time" class="time-label">0:00</span>
      </div>

      <div class="controls-row">
        <button id="btn-prev" class="ctrl-btn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6v12M20 6l-10 6 10 6V6z"/></svg>
        </button>
        <button id="btn-playpause" class="ctrl-btn ctrl-btn-main" title="Play/Pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7L7 5z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-next" class="ctrl-btn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M18 6v12M4 6l10 6-10 6V6z"/></svg>
        </button>

        <div class="volume-group">
          <button id="btn-mute" class="icon-btn" title="Mute">
            <svg id="icon-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
            <svg id="icon-muted" viewBox="0 0 24 24" class="hidden"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
          </button>
          <input id="volume-bar" type="range" min="0" max="100" value="70" />
        </div>
      </div>
    </main>

    <!-- RIGHT: Queue -->
    <aside class="panel panel-queue">
      <div class="queue-header">
        <h2>Queue <span id="queue-count" class="count-pill">0</span></h2>
        <div class="queue-actions">
          <button id="btn-skip" class="btn-small">Skip</button>
          <button id="btn-clear-queue" class="btn-small btn-small-danger">Clear</button>
        </div>
      </div>
      <ul id="queue-list" class="queue-list"></ul>
    </aside>

  </div>

  <!-- BOTTOM: add link -->
  <form id="form-add" class="add-bar">
    <input id="add-url-input" type="text" placeholder="Paste a YouTube or Spotify track link…" autocomplete="off" />
    <button type="submit" id="btn-add" class="btn-primary">Add to queue</button>
  </form>
  <p id="room-error" class="error-text error-text-bar"></p>

</section>

<template id="user-item-template">
  <li class="user-item">
    <span class="user-dot"></span>
    <span class="user-name"></span>
    <span class="owner-badge">Owner</span>
  </li>
</template>

<template id="queue-item-template">
  <li class="queue-item">
    <img class="queue-thumb" alt="" />
    <div class="queue-meta">
      <div class="queue-title"></div>
      <div class="queue-added-by"></div>
    </div>
    <button class="queue-remove icon-btn" title="Remove">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </li>
</template>

<!-- PlayFab Client SDK (loaded from PlayFab's CDN) -->
<script src="https://download.playfab.com/PlayFabClientApi.js"></script>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
